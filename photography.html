<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Shot by Ascnd</title>
    <link rel="stylesheet" type="text/css" href="assets/template.css">
    <link rel="stylesheet" href="photography.css">
    <script src="photography.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

</head>

<body>

    <div id="navbar">
    </div>

    <h1>Shot by Ascnd(Ascnd.JPEG)</h1>

    <h2>Digital Photography</h2>
    <div class="photos" id="digital">
    </div>

    <br>

    <h2>Film Photography</h2>
    <div class="photos" id="film">
    </div>

    <div id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <p>Last updated: <span id="last-updated"></span></p>
    <script src="assets/lastUpdated.js"></script>

    <script>
        fetch('assets/navbar.html')
            .then(r => r.text())
            .then(html => document.getElementById('navbar').innerHTML = html)
            .catch(e => console.error('Navbar load failed', e));
    </script>

</body>

</html>
